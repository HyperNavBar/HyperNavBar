name: Gesture Test APK

on:
  push:
    branches: [fix/hyperos-gesture-follow]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2' 'build-tools;37.0.0'

      - name: Run hook unit tests and build test APK
        run: ./gradlew --init-script .github/gesture-test.init.gradle :hook:testDebugUnitTest :app:assembleDebug

      - name: Verify test package
        run: |
          jq -e '.applicationId == "cn.ianzb.hypernavbar.gesturetest"' app/build/outputs/apk/debug/output-metadata.json
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk HyperNavBar-Gesture-Test-arm64-v8a.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: HyperNavBar-Gesture-Test-arm64-v8a
          path: HyperNavBar-Gesture-Test-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 7
